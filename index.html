<!DOCTYPE html>
<html>
<head>
    <title>Responsive Shopping Cart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Responsive Shopping Cart</h1>

<div class="products">

    <div class="card">
        <h2>Headphones</h2>
        <p>₹1500</p>
        <button onclick="addToCart('Headphones',1500)">Add to Cart</button>
    </div>

    <div class="card">
        <h2>Smart Watch</h2>
        <p>₹2500</p>
        <button onclick="addToCart('Smart Watch',2500)">Add to Cart</button>
    </div>

    <div class="card">
        <h2>Keyboard</h2>
        <p>₹1200</p>
        <button onclick="addToCart('Keyboard',1200)">Add to Cart</button>
    </div>

</div>

<h2>Shopping Cart</h2>

<ul id="cart"></ul>

<h3>Total: ₹<span id="total">0</span></h3>

<script src="script.js"></script>

</body>
</html>
